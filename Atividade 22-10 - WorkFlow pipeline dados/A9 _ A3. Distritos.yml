    - data:
        code: "function main({ contrato, texto }) {\n  const leituras = (t) => {\n\
          \    const semPonto = t.replace(/\\./g, \"\")\n    if (t.includes(\",\"\
          )) return [Number(semPonto.replace(\",\", \".\"))]\n    return [Number(t),\
          \ Number(semPonto)]\n  }\n  const doContrato = (JSON.stringify(contrato).match(/\\\
          d+(\\.\\d+)?/g) || []).map(Number)\n  const doTexto = texto.match(/\\d+(?:[.,]\\\
          d+)*/g) || []\n  const sem_origem = doTexto.filter((t) => !leituras(t).some((n)\
          \ => doContrato.includes(n)))\n  if (sem_origem.length > 0) {\n    return\
          \ { ok: 0, reprovado: { motivo: \"Números do texto sem origem no contrato\"\
          , sem_origem, texto } }\n  }\n  return { ok: 1, reprovado: {} }\n}\n"
        code_language: javascript
