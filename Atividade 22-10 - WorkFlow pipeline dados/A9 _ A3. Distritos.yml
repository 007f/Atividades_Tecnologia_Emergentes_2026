    - data:
        code: "function main({ codigo_ibge, status_code, body }) {\n  const base =\
          \ {\n    fonte: \"IBGE SIDRA, Censo 2022, tabela 9923, distritos\",\n  \
          \  codigo_ibge: codigo_ibge,\n  }\n  if (status_code !== 200) {\n    return\
          \ {\n      ok: 0,\n      contrato: {\n        ok: false,\n        ...base,\n\
          \        status_http: status_code,\n        erro: \"Consulta HTTP sem sucesso\"\
          ,\n      },\n    }\n  }\n  const linhas = JSON.parse(body).slice(1)\n  const\
          \ distritos = linhas.map((l) => l.D1N.split(\" - \")[0]).sort()\n  return\
          \ {\n    ok: 1,\n    contrato: {\n      ok: true,\n      ...base,\n    \
          \  dados: {\n        quantidade_distritos: linhas.length,\n        distritos:\
          \ distritos,\n      },\n    },\n  }\n}\n"
        code_language: javascript
        desc: ''
        outputs:
          contrato:
            children: null
            type: object
          ok:
            children: null
            type: number
